<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1f1538" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="lineGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.2" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulsePulse {
      0%, 100% { transform: scale(1); opacity: 0.7; }
      50% { transform: scale(1.15); opacity: 1; }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -100; }
    }
    @keyframes floatPill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatPillReverse {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }
    .flow-line {
      stroke-dasharray: 8, 8;
      animation: dashMove 3s linear infinite;
    }
    .pulse-node {
      transform-origin: center;
      animation: pulsePulse 3s ease-in-out infinite;
    }
    .pill-float-1 {
      animation: floatPill 4.5s ease-in-out infinite;
    }
    .pill-float-2 {
      animation: floatPillReverse 5s ease-in-out infinite;
    }
    .pill-float-3 {
      animation: floatPill 5.5s ease-in-out infinite 1s;
    }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5" />

  <!-- Dynamic Ambient Glow Spots (Background) -->
  <circle cx="150" cy="80" r="120" fill="#38bdf8" opacity="0.12" filter="url(#softGlow)" />
  <circle cx="1050" cy="280" r="140" fill="#c084fc" opacity="0.12" filter="url(#softGlow)" />
  <circle cx="950" cy="90" r="90" fill="#818cf8" opacity="0.15" filter="url(#softGlow)" />

  <!-- Dynamic Animated Circuit/Workflow Lines (Background) -->
  <g opacity="0.65">
    <path class="flow-line" d="M 50 180 C 250 180, 280 60, 480 60" fill="none" stroke="url(#lineGrad1)" stroke-width="2" />
    <path class="flow-line" d="M 720 60 C 920 60, 950 200, 1150 200" fill="none" stroke="url(#lineGrad1)" stroke-width="2" />
    <path class="flow-line" d="M 120 300 C 350 300, 420 320, 600 320 C 780 320, 850 300, 1080 300" fill="none" stroke="url(#lineGrad1)" stroke-width="2" />
  </g>

  <!-- Dynamic Ambient Animated Orbitals / Nodes (Background) -->
  <g class="pulse-node">
    <circle cx="280" cy="60" r="6" fill="#38bdf8" filter="url(#glow)" />
    <circle cx="920" cy="60" r="6" fill="#c084fc" filter="url(#glow)" />
    <circle cx="600" cy="320" r="7" fill="#818cf8" filter="url(#glow)" />
  </g>

  <!-- Dynamic Background Floating Capability Pills -->
  <g class="pill-float-1" transform="translate(80, 50)">
    <rect width="170" height="36" rx="18" fill="url(#cardGrad1)" stroke="#38bdf8" stroke-width="1.2" opacity="0.85" />
    <circle cx="20" cy="18" r="5" fill="#38bdf8" />
    <text x="34" y="23" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">⚡ Zapier &amp; n8n Flows</text>
  </g>

  <g class="pill-float-2" transform="translate(950, 45)">
    <rect width="180" height="36" rx="18" fill="url(#cardGrad1)" stroke="#818cf8" stroke-width="1.2" opacity="0.85" />
    <circle cx="20" cy="18" r="5" fill="#818cf8" />
    <text x="34" y="23" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🧩 Power-Ups &amp; Add-Ons</text>
  </g>

  <g class="pill-float-3" transform="translate(930, 275)">
    <rect width="190" height="36" rx="18" fill="url(#cardGrad1)" stroke="#c084fc" stroke-width="1.2" opacity="0.85" />
    <circle cx="20" cy="18" r="5" fill="#c084fc" />
    <text x="34" y="23" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🤖 AI Agents &amp; Webhooks</text>
  </g>

  <g class="pill-float-2" transform="translate(70, 275)">
    <rect width="180" height="36" rx="18" fill="url(#cardGrad1)" stroke="#22c55e" stroke-width="1.2" opacity="0.85" />
    <circle cx="20" cy="18" r="5" fill="#22c55e" />
    <text x="34" y="23" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🌐 500+ App Connectors</text>
  </g>

  <!-- FOREGROUND: Central Branding (Always crisp, prominent, high contrast & never obscured) -->
  <g transform="translate(600, 140)">
    <!-- Category Badge -->
    <rect x="-140" y="-48" width="280" height="28" rx="14" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" />
    <text x="0" y="-30" text-anchor="middle" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.5">🚀 CURATED WORKFLOW ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="0" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" fill="url(#primaryGrad)" filter="url(#glow)">Awesome Workflow Integration Add-Ons</text>
    <text x="0" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" fill="#ffffff">Awesome Workflow Integration Add-Ons</text>

    <!-- Subtitle -->
    <text x="0" y="65" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500">
      The definitive directory of SaaS integration platforms, native marketplace extensions &amp; self-hosted open-source automation engines
    </text>

    <!-- Tagline highlights -->
    <text x="0" y="98" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" letter-spacing="0.8">
      🔌 iPaaS &bull; 🧩 Platform Plugins &bull; 🤖 Multi-Step AI Automation &bull; 🏢 Enterprise Connectors
    </text>
  </g>
</svg>